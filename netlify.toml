[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Arahkan seluruh rute React Router ke index.html agar tidak 404 saat di-refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

